<svg xmlns="http://www.w3.org/2000/svg" width="590" height="330" viewBox="0 0 590 330" role="img" aria-labelledby="t d">
  <title id="t">Asset and Vulnerability Tracker</title>
  <desc id="d">MERN app to track assets and vulnerabilities, with a Redis-cached dashboard. Animated dashboard preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#0f1a30"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="c"><rect width="590" height="330" rx="16"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: bar 6s cubic-bezier(.2,.8,.2,1) infinite both; }
    .b2 { animation-delay: .15s; } .b3 { animation-delay: .3s; } .b4 { animation-delay: .45s; }
    @keyframes bar { 0% { transform: scaleY(0); } 20%, 85% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
    .row { animation: row 6s ease infinite both; }
    .r2 { animation-delay: .4s; } .r3 { animation-delay: .8s; }
    @keyframes row { 0% { opacity: 0; transform: translateX(10px); } 15%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    .flip { animation: flip 6s steps(1, end) infinite; }
    @keyframes flip { 0%, 49% { fill: #f59e0b; } 50%, 100% { fill: #22c55e; } }
    .open { animation: open 6s steps(1, end) infinite; } .fixed { animation: fixed 6s steps(1, end) infinite; }
    @keyframes open { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes fixed { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }
    .hit { animation: hit 6s steps(1, end) infinite; }
    @keyframes hit { 0%, 54% { opacity: 0; } 55%, 85% { opacity: 1; } 86%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fixed, .hit { opacity: 0; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="590" height="330" fill="url(#bg)"/>
    <rect x="0" y="0" width="590" height="2" fill="url(#edge)"/>
    <rect x="0.5" y="0.5" width="589" height="329" rx="16" fill="none" stroke="#1e293b"/>

    <g class="sans">
      <text x="28" y="44" font-size="12" fill="#22d3ee" letter-spacing="2" font-weight="700">PROJECT 01 · MERN</text>
      <text x="28" y="76" font-size="25" font-weight="700" fill="#f1f5f9">Asset &amp; Vulnerability Tracker</text>
      <text x="28" y="102" font-size="14" fill="#94a3b8">Track every asset and vulnerability until it's fixed.</text>
    </g>

    <!-- mini dashboard -->
    <g transform="translate(28,124)">
      <rect width="534" height="140" rx="10" fill="#0a101e" stroke="#1e293b"/>
      <g class="sans" font-size="10" fill="#64748b">
        <text x="16" y="22">OPEN BY SEVERITY</text>
        <text x="236" y="22">RECENT</text>
      </g>
      <g transform="translate(16,34)">
        <line x1="0" y1="90" x2="190" y2="90" stroke="#1e293b"/>
        <rect class="bar" x="8" y="20" width="32" height="70" rx="4" fill="#ef4444"/>
        <rect class="bar b2" x="56" y="40" width="32" height="50" rx="4" fill="#f97316"/>
        <rect class="bar b3" x="104" y="56" width="32" height="34" rx="4" fill="#eab308"/>
        <rect class="bar b4" x="152" y="72" width="32" height="18" rx="4" fill="#38bdf8"/>
      </g>
      <g class="mono" font-size="11">
        <g class="row"><rect x="236" y="34" width="282" height="26" rx="6" fill="#111a2e"/><circle cx="250" cy="47" r="4" fill="#ef4444"/><text x="262" y="51" fill="#e2e8f0">SQL injection · api.acme</text>
          <rect class="flip" x="446" y="39" width="62" height="16" rx="8" fill="#f59e0b"/>
          <text class="open" x="477" y="51" text-anchor="middle" fill="#1c1917" font-size="10" font-weight="700">OPEN</text>
          <text class="fixed" x="477" y="51" text-anchor="middle" fill="#052e16" font-size="10" font-weight="700" opacity="0">FIXED</text></g>
        <g class="row r2"><rect x="236" y="66" width="282" height="26" rx="6" fill="#111a2e"/><circle cx="250" cy="79" r="4" fill="#f97316"/><text x="262" y="83" fill="#e2e8f0">Stored XSS · shop.acme</text>
          <rect x="446" y="71" width="62" height="16" rx="8" fill="#6366f1"/><text x="477" y="83" text-anchor="middle" fill="#eef2ff" font-size="9" font-weight="700">IN PROG</text></g>
        <g class="row r3"><rect x="236" y="98" width="282" height="26" rx="6" fill="#111a2e"/><circle cx="250" cy="111" r="4" fill="#eab308"/><text x="262" y="115" fill="#e2e8f0">Weak TLS · vpn.acme</text>
          <rect x="446" y="103" width="62" height="16" rx="8" fill="#f59e0b"/><text x="477" y="115" text-anchor="middle" fill="#1c1917" font-size="10" font-weight="700">OPEN</text></g>
      </g>
      <g class="hit mono" font-size="10"><rect x="376" y="6" width="142" height="20" rx="10" fill="#052e16" stroke="#22c55e"/><text x="447" y="20" text-anchor="middle" fill="#4ade80">stats cache cleared ✓</text></g>
    </g>

    <g class="mono" font-size="11">
      <rect x="28" y="282" width="62" height="24" rx="12" fill="#0f172a" stroke="#334155"/><text x="59" y="298" text-anchor="middle" fill="#cbd5e1">JWT</text>
      <rect x="98" y="282" width="62" height="24" rx="12" fill="#0f172a" stroke="#334155"/><text x="129" y="298" text-anchor="middle" fill="#cbd5e1">RBAC</text>
      <rect x="168" y="282" width="62" height="24" rx="12" fill="#0f172a" stroke="#334155"/><text x="199" y="298" text-anchor="middle" fill="#f87171">Redis</text>
      <rect x="238" y="282" width="108" height="24" rx="12" fill="#0f172a" stroke="#334155"/><text x="292" y="298" text-anchor="middle" fill="#a78bfa">Redux Toolkit</text>
      <rect x="354" y="282" width="70" height="24" rx="12" fill="#0f172a" stroke="#334155"/><text x="389" y="298" text-anchor="middle" fill="#60a5fa">Docker</text>
      <text x="562" y="298" text-anchor="end" fill="#22d3ee" font-size="12">View repo →</text>
    </g>
  </g>
</svg>
